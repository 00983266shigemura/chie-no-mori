<!DOCTYPE html>
<!-- ちえの もり ── iPad よこおき（1024×640）で 1がめんに おさまるかの 検査（CCが使う。tools/check_all.zsh から よぶ）
     ぜんぶの がめんと、こたえた あとの すがた（ことば・つぎへ）を じゅんに 出して、たて・よこの はみだしを 測る。
     あわせて、画面から 1まわり ぜんぶ（7つの型＋まぜまぜ）を 通して 例外が 出ないかを 見る。
     #shot=〈なまえ〉 を つけると、そこで とめて スクリーンショット用に する -->
<html lang="ja"><head><meta charset="utf-8"><title>fit check</title></head>
<body style="margin:0">
<!-- 開くのは 無音の複製だけ（tools/mkpage.py が作る）。index.html を直接開かない＝試験で音を鳴らさない -->
<iframe id="f" src="../logs/silent_index.html" style="width:1024px;height:640px;border:0;display:block"></iframe>
<pre id="out"></pre>
<script>
var sz = location.hash.match(/size=(\d+)x(\d+)/) || [0, 1024, 640];
var W = +sz[1], H = +sz[2], fails = [], n = 0, maxH = 0, maxTag = '';
document.getElementById('f').style.width = W + 'px'; document.getElementById('f').style.height = H + 'px';
var shot = (location.hash.match(/shot=([a-z0-9]+)/) || [])[1] || '';
function put(s) { document.getElementById('out').textContent += s + '\n'; }
document.getElementById('f').onload = function () {
  var w = this.contentWindow, d = w.document, errs = [], played = 0;
  w.onerror = function (m) { errs.push(String(m)); };
  function el(id) { return d.getElementById(id); }
  function meas(tag) {
    var de = d.documentElement, h = Math.max(de.scrollHeight, d.body.scrollHeight), wd = Math.max(de.scrollWidth, d.body.scrollWidth);
    n++;
    if (h > maxH) { maxH = h; maxTag = tag; }
    if (h > H || wd > W) { fails.push(tag + ' たて=' + h + ' よこ=' + wd); }
    return shot === tag;
  }
  function stop() { throw 'shot'; }
  /* てんせん＝おてほんの 線を そのまま 手もとへ 写して「できた！」（正解の経路） */
  function solveTen() {
    var r = w.CM.ui.round(), q = r.qs[r.idx], t = w.CM.ui.ten(), k;
    for (k in q.model) { if (q.model.hasOwnProperty(k)) { t.set[k] = q.model[k]; } }
    el('ten-check').click();
  }
  /* mode 0＝1回で正解 1＝1回まちがえて 正解 2＝2回 まちがえる（答えが 出て、にた もんだいが はさまる） */
  function answerOne(mode, gid) {
    var r = w.CM.ui.round(), q = r.qs[r.idx], ch, k, t, segs, wrongs = [];
    if (q.kind === 'tap') {
      if (mode >= 1) {
        t = w.CM.ui.ten(); segs = w.CM.setToSegs(q.model);
        t.set[w.CM.segKey(segs[0][0], segs[0][1])] = segs[0];   /* 1本だけ＝たりない */
        el('ten-check').click();
        if (meas('hint' + gid)) { stop(); }
        if (mode === 2) { el('ten-check').click(); return; }
      }
      solveTen();
      return;
    }
    if (el('story-box').style.display !== 'none' && el('story-go').style.display !== 'none') { if (meas('story' + gid)) { stop(); } el('story-go').click(); }
    ch = el('choices').getElementsByClassName('choice');
    for (k = 0; k < ch.length; k++) { if (k !== q.answerIndex) { wrongs.push(k); } }
    if (mode >= 1) { ch[wrongs[0]].click(); if (meas('hint' + gid)) { stop(); } }
    if (mode === 2) { ch[wrongs[1]].click(); return; }
    ch[q.answerIndex].click();
  }
  try {
    w.CM.seed(7);
    if (!/timer=1/.test(location.hash)) { w.CM.ui.setTimer(false); }   /* 制限時間は 別の検査（timer_check）で見る＝ここでは 止める（撮影で ぼうを 見たいときだけ #timer=1） */
    if (meas('home')) { stop(); }
    var gids = ['ten', 'kagami', 'kazoe', 'shiso', 'tonneru', 'onaji', 'kasane', 'kisetsu', 'kotoba', 'ohanashi', 'mix'], gi, q, r, expected = 0, planned0;
    for (gi = 0; gi < gids.length; gi++) {
      w.CM.ui.startRound(gids[gi]);
      planned0 = w.CM.ui.round().planned;
      /* 2回目の まちがいの あとは「にた もんだい」が 1つ はさまる＝けっかの 画面が 出るまで 回す（最大 20問） */
      for (q = 0; q < 20 && el('scr-result').style.display === 'none'; q++) {
        if (meas('play' + gids[gi])) { stop(); }
        answerOne(q === 1 ? 1 : (q === 3 ? 2 : 0), gids[gi]);
        played++;
        if (el('next-btn').style.display === 'none') { errs.push(gids[gi] + ' ' + q + ' つぎへ が 出ない'); el('next-btn').style.display = 'inline-block'; }
        if (meas('ans' + gids[gi])) { stop(); }
        el('next-btn').click();
      }
      r = w.CM.ui.round();
      expected += r.qs.length;
      /* 4問目（添字3）で 2回まちがえる→ にた もんだいが はさまる。おはなしは おはなしごと（2〜5問）なので 数は 型で変わる */
      if (r.qs[3].g === 'ohanashi') { if (r.qs.length < planned0 + 2) { errs.push(gids[gi] + ' おはなしの にた もんだいが はさまっていない ' + r.qs.length + ' vs ' + planned0); } }
      else if (r.qs.length !== planned0 + 1) { errs.push(gids[gi] + ' にた もんだいの 数が ちがう ' + r.qs.length + ' vs ' + (planned0 + 1)); }
      if (!r.qs[4].retest || r.qs[4].g !== r.qs[3].g || r.qs[4].level !== r.qs[3].level) { errs.push(gids[gi] + ' にた もんだいが 同じ型・同じレベルでない'); }
      if (meas('result' + gids[gi])) { stop(); }
      el('res-home').click();
    }
    if (meas('homeafter')) { stop(); }
    el('zukan-btn').click();
    if (meas('zukan')) { stop(); }
    el('zukan-back').click();
    var ev = d.createEvent('MouseEvents'); ev.initEvent('mousedown', true, true); el('grown-btn').dispatchEvent(ev);
    w.setTimeout(function () {
      meas('grown');
      put('MEASURED=' + n + ' MAXH=' + maxH + ' at ' + maxTag + ' PLAYED=' + played);
      put('ERRS=' + errs.length + (errs.length ? ' ' + errs.join(' | ') : ''));
      var asked = w.__audioAsked, silent = (typeof asked === 'number' && asked > 0 && w.CM.snd.ctx === null);
      put('AUDIO asked=' + asked + ' ctx=' + (w.CM.snd.ctx === null ? 'なし' : 'あり') + ' → ' + (silent ? '無音' : '無音でない'));
      put('EXPECTED=' + expected);
      put(fails.length === 0 && errs.length === 0 && silent && played === expected && played >= 66 ? 'FIT=PASS' : 'FIT=FAIL played=' + played + ' expected=' + expected + ' ' + (silent ? '' : '無音化が効いていない ') + fails.slice(0, 12).join(' / ') + ' ' + errs.slice(0, 6).join(' | '));
    }, 1500);
  } catch (e) {
    if (e === 'shot') { put('SHOT=' + shot); document.getElementById('out').style.display = 'none'; }
    else { put('FIT=FAIL 例外 ' + e + (e && e.stack ? ' ' + e.stack : '')); }
  }
};
</script>
</body></html>
